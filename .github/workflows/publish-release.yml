name: Publish driver release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Create GitHub Release and upload installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="dist/RobertDo3Think_ASCOM_Camera_Driver_Setup_${version}.exe"
          test -f "$asset"

          if [ -f "release-notes/${GITHUB_REF_NAME}.md" ]; then
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Robert Do3Think ASCOM Camera Driver ${GITHUB_REF_NAME}" \
              --notes-file "release-notes/${GITHUB_REF_NAME}.md"
          else
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Robert Do3Think ASCOM Camera Driver ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
